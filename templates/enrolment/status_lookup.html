<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track ID Onboarding — EduID Kenya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 15% 15%, #1e3a8a 0%, #0f172a 65%, #050b14 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 16px;
    }
    .lookup-card {
      background: white;
      border-radius: 20px;
      max-width: 500px;
      width: 100%;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      text-align: center;
    }
    .lookup-card h2 { font-size: 1.3rem; font-weight: 800; color: #0F172A; margin-bottom: 8px; }
    .lookup-card p { font-size: 0.85rem; color: #64748B; margin-bottom: 20px; }
    .lookup-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1.5px solid #CBD5E1;
      font-size: 0.95rem;
      margin-bottom: 14px;
      outline: none;
    }
    .lookup-input:focus { border-color: #1E3A8A; box-shadow: 0 0 0 3px rgba(30,58,138,0.12); }
    .btn-track {
      width: 100%;
      padding: 12px;
      background: #1E3A8A;
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
    }
    .error-box {
      background: #FEF2F2;
      border: 1px solid #FCA5A5;
      color: #991B1B;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.82rem;
      margin-bottom: 16px;
      text-align: left;
    }
  </style>
</head>
<body>
<div class="lookup-card">
  <i class="fa-solid fa-magnifying-glass-location fa-3x text-primary mb-3"></i>
  <h2>Track Your ID Card Status</h2>
  <p>Enter the private Submission Reference shown after you submitted your application. For privacy, admission numbers cannot be used to view status.</p>

  {% if error %}
  <div class="error-box"><i class="fa-solid fa-circle-exclamation me-1"></i> {{ error }}</div>
  {% endif %}

  <form onsubmit="event.preventDefault(); var t = document.getElementById('refInput').value.trim(); if(t) window.location.href='/onboard/status/' + encodeURIComponent(t);">
    <input type="text" id="refInput" class="lookup-input" placeholder="e.g. ENR-2026-A1B2" required autofocus>
    <button type="submit" class="btn-track"><i class="fa-solid fa-arrow-right me-1"></i> Look Up Status</button>
  </form>

  <p style="margin-top:20px; font-size:0.75rem;"><a href="/onboard" style="color:#1E3A8A; text-decoration:none; font-weight:600;"><i class="fa-solid fa-arrow-left me-1"></i> Return to School Directory</a></p>
</div>
</body>
</html>
